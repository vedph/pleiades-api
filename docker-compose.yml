services:
  pleiades-pgsql:
    image: postgis/postgis
    container_name: pleiades-pgsql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - pleiades-network
    volumes:
      # place bin dumps into ./dump for automatic restore
      - ./dump:/var/pleiades
    # uncomment to persist data into volume
    #  - pleiades-vol:/var/lib/postgresql

  pleiades-api:
    image: vedph2020/pleiades-api:3.0.2
    container_name: pleiades-api
    ports:
        # https://stackoverflow.com/questions/48669548/why-does-aspnet-core-start-on-port-80-from-within-docker
        - 127.0.0.1:29139:8080
    depends_on:
        - pleiades-pgsql
    environment:
        - ASPNETCORE_URLS=http://+:8080
        - CONNECTIONSTRINGS__DEFAULT=User ID=postgres;Password=postgres;Host=pleiades-pgsql;Port=5432;Database=pleiades;
        # - ALLOWEDORIGINS__3=http://www.something.com
        - SEEDDELAY=30
        - SERILOG__CONNECTIONSTRING=mongodb://pleiades:27017/{0}-log
    networks:
        - pleiades-network

networks:
  pleiades-network:
    driver: bridge

# uncomment to persist PostgreSQL data into a volume
#volumes:
#  pleiades-vol:
