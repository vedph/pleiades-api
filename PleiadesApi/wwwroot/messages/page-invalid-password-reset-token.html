<!DOCTYPE html>
<html>
<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{AppName}} - Password Reset Failed</title>
</head>
<body>
    <div class="container">
        <h2>{{AppName}}</h2>
        <h3>Password Reset Failed</h3>
        <p>The password reset has failed. Probably too much time has passed since your request, or the link was already used. Please request a new password reset.</p>
    </div>
    <hr class="soften">
    <footer class="footer">
        <div class="container">
            <div class="row text-center text-muted">
                <p>Should you have any issues, please write to <a href="mailto:{{SupportEmail}}">this address</a>.</p>
            </div>
        </div>
    </footer>
</body>
</html>
